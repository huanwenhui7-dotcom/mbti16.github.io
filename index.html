            ISTJ: { name: "物流师", group: "Sentinels", groupName: "守护者", color: "#3B82F6", desc: "实际且注重事实的可靠之人，其可靠性不容置疑。", traits: ["严谨负责", "踏实稳重", "遵守纪律", "略显固执"], careers: ["注册会计师", "审计师", "行政总监", "高级法官"], love: "用行动代替甜言蜜语，极其忠诚稳定，是长久过日子的不二人选。", match: "ESFP, ESTP" },
            ISFJ: { name: "守卫者", group: "Sentinels", groupName: "守护者", color: "#2563EB", desc: "非常专心致志且温暖的守护者，时刻准备着保护他们爱的人。", traits: ["细心体贴", "无私奉献", "记忆力强", "不懂拒绝"], careers: ["医护人员", "幼儿教师", "社会工作者", "行政专员"], love: "温柔体贴，默默付出，把家庭和伴侣的幸福放在绝对的第一位。", match: "ESTP, ESFP" },
            ESTJ: { name: "总经理", group: "Sentinels", groupName: "守护者", color: "#1D4ED8", desc: "出色的管理者，在管理事情或人方面无出其右。", traits: ["组织力强", "直言不讳", "责任心重", "控制欲强"], careers: ["高级运营总监", "银行行长", "政府官员", "项目经理"], love: "稳定可靠，有强烈的家庭责任感，喜欢生活井井有条。", match: "ISFP, ISTP" },
            ESFJ: { name: "执政官", group: "Sentinels", groupName: "守护者", color: "#60A5FA", desc: "极有同情心、爱交际且受欢迎的人，总是热心提供帮助。", traits: ["热情友好", "善于照顾人", "重视传统", "在意评价"], careers: ["活动策划人", "公关经理", "客服主管", "人力资源"], love: "浪漫、重视节日与纪念日，极度需要伴侣的情感肯定与赞美。", match: "ISTP, ISFP" },
            ISTP: { name: "鉴赏家", group: "Explorers", groupName: "探险家", color: "#F59E0B", desc: "大胆而实际的实验家，擅长使用各种形式的工具。", traits: ["动手能力强", "冷静应变", "崇尚自由", "难以预测"], careers: ["机械工程师", "飞行员", "特技演员", "硬件极客"], love: "相处轻松不粘人，用实际行动解决问题，崇尚给彼此足够的自由度。", match: "ESTJ, ESFJ" },
            ISFP: { name: "探险家", group: "Explorers", groupName: "探险家", color: "#D97706", desc: "灵活而迷人的艺术家，时刻准备着探索和体验新鲜事物。", traits: ["审美极佳", "温柔随和", "热爱自由", "回避冲突"], careers: ["室内设计师", "时装设计师", "摄影师", "音乐家"], love: "极具浪漫情调与艺术气息，用细腻的行动和礼物表达浓浓爱意。", match: "ENFJ, ESFJ" },
            ESTP: { name: "企业家", group: "Explorers", groupName: "探险家", color: "#B45309", desc: "聪明、精力充沛且非常善于感知的人，享受生活在边缘。", traits: ["机智果断", "行动力强", "极具魅力", "缺乏长性"], careers: ["企业创始人", "销售总监", "运动员", "战地记者"], love: "恋爱轰轰烈烈，追求刺激与新鲜感，幽默风趣且极具吸引力。", match: "ISFJ, ISTJ" },
            ESFP: { name: "表演者", group: "Explorers", groupName: "探险家", color: "#FBBF24", desc: "充满活力与热情的人，生活在他们周围永不无聊。", traits: ["天生乐观", "极具感染力", "热爱狂欢", "逃避沉重"], careers: ["演员/艺人", "时尚买手", "活动主持人", "导游"], love: "把恋爱变成一场盛大的派对，给伴侣带来无尽的快乐与浪漫惊喜。", match: "ISTJ, ISFJ" }
        };

        function LowPolyAvatar({ type }) {
            const colors = {
                Analysts: ["#c084fc", "#7e22ce", "#a855f7"],
                Diplomats: ["#34d399", "#047857", "#10b981"],
                Sentinels: ["#60a5fa", "#1d4ed8", "#3b82f6"],
                Explorers: ["#fbbf24", "#b45309", "#f59e0b"]
            };
            const group = mbtiData[type]?.group || "Analysts";
            const [c1, c2, c3] = colors[group];

            return (
                <svg viewBox="0 0 200 200" className="w-full h-full drop-shadow-lg">
                    <defs>
                        <linearGradient id={`grad-${type}`} x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stopColor={c1} />
                            <stop offset="50%" stopColor={c2} />
                            <stop offset="100%" stopColor={c3} />
                        </linearGradient>
                    </defs>
                    <rect width="200" height="200" rx="40" fill={`url(#grad-${type})`} opacity="0.15" />
                    <polygon points="100,20 140,50 160,100 100,130 40,100 60,50" fill={`url(#grad-${type})`} opacity="0.8" />
                    <polygon points="100,130 160,100 180,160 100,190 20,160 40,100" fill={c2} opacity="0.6" />
                    <polygon points="70,70 100,45 130,70 100,105" fill="#ffffff" opacity="0.3" />
                    <polygon points="85,85 100,70 115,85 100,100" fill="#ffffff" opacity="0.5" />
                    <circle cx="80" cy="85" r="8" fill="#1e293b" />
                    <circle cx="120" cy="85" r="8" fill="#1e293b" />
                    <polygon points="100,100 92,120 108,120" fill="#1e293b" opacity="0.8" />
                    <path d="M 85 140 Q 100 155 115 140" stroke="#1e293b" strokeWidth="5" fill="none" strokeLinecap="round" />
                    <text x="100" y="38" textAnchor="middle" fill="#ffffff" fontSize="16" fontWeight="bold" letterSpacing="2">{type}</text>
                </svg>
            );
        }

        function App() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const isAdmin = urlParams.get('admin') === 'true'; // 管理员身份识别

            // 本地存储管理统计数据与使用记录
            // 数据结构: mbti_logs = [ { token: 'xxx', time: '2026-06-06 12:00', type: 'INTJ' }, ... ]
            const [logs, setLogs] = React.useState(() => {
                const saved = localStorage.getItem('mbti_usage_logs');
                return saved ? JSON.parse(saved) : [];
            });

            const tokenUsedKey = `mbti_used_${token}`;
            const isTokenAlreadyUsed = token && localStorage.getItem(tokenUsedKey) === 'true';

            const [view, setView] = React.useState(() => {
                if (isAdmin) return 'home'; // 管理员直接进
                if (isTokenAlreadyUsed) return 'expired';
                if (!token) return 'unauthorized'; // 普通用户没带 token 拦截
                return 'home';
            });

            const [questions, setQuestions] = React.useState([]);
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [resultType, setResultType] = React.useState(null);
            const [scores, setScores] = React.useState(null);
            const [selectedModalType, setSelectedModalType] = React.useState(null);

            // 如果普通用户没带 token
            if (!isAdmin && !token) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="clay-card max-w-md w-full p-8 text-center">
                            <div className="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">🔒</div>
                            <h2 className="text-2xl font-bold text-slate-800 mb-2">需要访问授权</h2>
                            <p className="text-slate-600 text-sm mb-6">当前页面需要通过管理员分发的专属测试链接才能进入。如果您是管理员，请在网址后加上 <code className="bg-slate-100 px-1.5 py-0.5 rounded text-purple-600">?admin=true</code>。</p>
                        </div>
                    </div>
                );
            }

            if (!isAdmin && isTokenAlreadyUsed && view !== 'result' && view !== 'expired') {
                setView('expired');
            }

            const startQuiz = () => {
                if (!isAdmin && localStorage.getItem(tokenUsedKey) === 'true') {
                    setView('expired');
                    return;
                }
                const generated = getRandomTestQuestions();
                setQuestions(generated);
                setCurrentIndex(0);
                setAnswers({});
                setView('quiz');
            };

            const handleSelectOption = (questionId, type, score) => {
                setAnswers({ ...answers, [questionId]: { type, score } });
            };

            const handleNext = () => {
                if (!answers[questions[currentIndex].id]) return;
                if (currentIndex < questions.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                } else {
                    calculateResult();
                }
            };

            const handlePrev = () => {
                if (currentIndex > 0) setCurrentIndex(currentIndex - 1);
            };

            const calculateResult = () => {
                let counts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
                Object.values(answers).forEach(ans => {
                    if (counts[ans.type] !== undefined) counts[ans.type] += ans.score;
                });

                const finalType = (counts.E >= counts.I ? 'E' : 'I') +
                                  (counts.S >= counts.N ? 'S' : 'N') +
                                  (counts.T >= counts.F ? 'T' : 'F') +
                                  (counts.J >= counts.P ? 'J' : 'P');

                setResultType(finalType);
                setScores(counts);

                // 如果不是管理员测试，记录一次使用并锁定 token
                if (!isAdmin && token) {
                    localStorage.setItem(tokenUsedKey, 'true');
                    const newLog = {
                        token: token,
                        result: finalType,
                        time: new Date().toLocaleString()
                    };
                    const updatedLogs = [newLog, ...logs];
                    setLogs(updatedLogs);
                    localStorage.setItem('mbti_usage_logs', JSON.stringify(updatedLogs));
                }

                setView('result');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            if (view === 'expired') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="clay-card max-w-md w-full p-8 text-center">
                            <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">🔒</div>
                            <h2 className="text-2xl font-bold text-slate-800 mb-2">该测试链接已失效</h2>
                            <p className="text-slate-600 text-sm mb-6">此专属测试链接已经成功使用并生成过一次报告。每个链接仅限完整使用 1 次。</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col justify-between p-4 sm:p-6 lg:p-8">
                    {/* 顶部导航 */}
                    <header className="max-w-5xl mx-auto w-full flex justify-between items-center py-4 mb-6">
                        <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setView('home')}>
                            <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-500 to-indigo-500 flex items-center justify-center text-white font-bold text-lg shadow-md">M</div>
                            <span className="text-xl font-extrabold tracking-wider bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">MBTI PERSONALITIES</span>
                        </div>
                        <div className="flex space-x-2 sm:space-x-3 items-center">
                            <button onClick={() => setView('home')} className={`px-3 sm:px-4 py-2 rounded-xl text-sm font-semibold transition ${view === 'home' ? 'bg-purple-600 text-white shadow-md' : 'bg-white/80 hover:bg-white text-slate-600'}`}>首页</button>
                            <button onClick={() => setView('encyclopedia')} className={`px-3 sm:px-4 py-2 rounded-xl text-sm font-semibold transition ${view === 'encyclopedia' ? 'bg-purple-600 text-white shadow-md' : 'bg-white/80 hover:bg-white text-slate-600'}`}>图鉴</button>
                            
                            {/* 只有管理员才能看到的后台数据按钮 */}
                            {isAdmin && (
                                <button onClick={() => setView('admin')} className={`px-3 sm:px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center space-x-1 ${view === 'admin' ? 'bg-amber-600 text-white shadow-md' : 'bg-amber-100 hover:bg-amber-200 text-amber-800'}`}>
                                    <span>👑 管理后台</span>
                                    <span className="ml-1 px-1.5 py-0.5 bg-white/80 text-amber-900 rounded-full text-xs">{logs.length}</span>
                                </button>
                            )}
                        </div>
                    </header>

                    {/* 主体内容 */}
                    <main className="max-w-4xl mx-auto w-full flex-grow">
                        {/* 1. 首页 */}
                        {view === 'home' && (
                            <div className="clay-card p-8 sm:p-12 text-center relative overflow-hidden">
                                {isAdmin && (
                                    <div className="mb-4 inline-block bg-amber-50 border border-amber-200 text-amber-800 text-xs px-3 py-1.5 rounded-xl font-bold">
                                        👑 当前为管理员身份登录（可无限次测试，并可随时查看使用统计后台）
                                    </div>
                                )}
                                <h1 className="text-3xl sm:text-5xl font-black text-slate-800 mb-6 leading-tight">探索真实的自己，<br/>发现你的灵魂密码</h1>
                                <p className="text-slate-600 max-w-xl mx-auto mb-10 text-base sm:text-lg">基于 100 道精选题库智能抽取 30 题，多维解析你的性格偏好、职场潜能与情感模式。</p>
                                <button onClick={startQuiz} className="clay-btn bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold px-10 py-4 rounded-2xl text-lg shadow-xl hover:opacity-95">开始 30 题专业测试 ✨</button>
                            </div>
                        )}

                        {/* 2. 管理员数据后台页面 */}
                        {view === 'admin' && isAdmin && (
                            <div className="space-y-6 animate-fade-in pb-12">
                                <div className="clay-card p-6 sm:p-8 bg-gradient-to-r from-slate-900 to-purple-950 text-white">
                                    <h2 className="text-2xl font-black mb-2">👑 管理员专属控制台</h2>
                                    <p className="text-purple-200 text-sm">这里记录了所有通过外发链接完成测试的用户数据与使用次数，普通用户无法访问。</p>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div className="clay-card p-6 bg-white">
                                        <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">网站总使用次数 (成功出结果)</div>
                                        <div className="text-4xl font-black text-purple-600">{logs.length} <span className="text-sm font-normal text-slate-500">次</span></div>
                                    </div>
                                    <div className="clay-card p-6 bg-white">
                                        <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">当前管理员权限</div>
                                        <div className="text-xl font-bold text-emerald-600 flex items-center mt-2">
                                            <span className="w-3 h-3 rounded-full bg-emerald-500 inline-block mr-2 animate-pulse"></span>
                                            无限畅玩中 (?admin=true)
                                        </div>
                                    </div>
                                </div>

                                <div className="clay-card p-6 sm:p-8">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4">详细使用记录清单</h3>
                                    {logs.length === 0 ? (
                                        <div className="text-center py-12 text-slate-400 text-sm">暂无其他人使用记录。赶紧把链接发给朋友测试吧！</div>
                                    ) : (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse">
                                                <thead>
                                                    <tr className="border-b border-slate-100 text-xs text-slate-400 uppercase">
                                                        <th className="py-3 px-4">序号</th>
                                                        <th className="py-3 px-4">访客 Token / 标识</th>
                                                        <th className="py-3 px-4">测试结果</th>
                                                        <th className="py-3 px-4">完成时间</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="text-sm divide-y divide-slate-100">
                                                    {logs.map((log, index) => (
                                                        <tr key={index} className="hover:bg-slate-50">
                                                            <td className="py-3 px-4 text-slate-400 font-mono">#{logs.length - index}</td>
                                                            <td className="py-3 px-4 font-bold text-slate-700">{log.token}</td>
                                                            <td className="py-3 px-4"><span className="px-2.5 py-1 rounded-lg bg-purple-100 text-purple-700 font-bold text-xs">{log.result}</span></td>
                                                            <td className="py-3 px-4 text-slate-500 text-xs">{log.time}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 3. 答题交互页 */}
                        {view === 'quiz' && questions.length > 0 && (
                            <div className="clay-card p-6 sm:p-10 animate-fade-in">
                                <div className="flex justify-between items-center mb-6">
                                    <span className="text-xs font-bold text-purple-600 uppercase tracking-wider">题目 {currentIndex + 1} / {questions.length}</span>
                                    <span className="text-xs font-medium text-slate-400">{Math.round(((currentIndex + 1) / questions.length) * 100)}% 完成</span>
                                </div>
                                <div className="w-full bg-slate-100 h-2.5 rounded-full mb-8 overflow-hidden">
                                    <div className="bg-gradient-to-r from-purple-500 to-indigo-500 h-2.5 rounded-full transition-all duration-300" style={{ width: `${((currentIndex + 1) / questions.length) * 100}%` }}></div>
                                </div>

                                <h2 className="text-xl sm:text-2xl font-bold text-slate-800 mb-8 leading-snug">{questions[currentIndex].text}</h2>

                                <div className="space-y-4 mb-8">
                                    {questions[currentIndex].options.map((opt, idx) => {
                                        const isSelected = answers[questions[currentIndex].id]?.type === opt.type && answers[questions[currentIndex].id]?.score === opt.score;
                                        return (
                                            <div 
                                                key={idx} 
                                                onClick={() => handleSelectOption(questions[currentIndex].id, opt.type, opt.score)}
                                                className={`p-4 sm:p-5 rounded-2xl border-2 cursor-pointer transition-all flex items-center justify-between ${isSelected ? 'border-purple-600 bg-purple-50/60 shadow-sm' : 'border-slate-100 bg-white hover:border-purple-200 hover:bg-slate-50'}`}
                                            >
                                                <div className="flex items-center space-x-3">
                                                    <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs font-bold ${isSelected ? 'border-purple-600 bg-purple-600 text-white' : 'border-slate-300 text-transparent'}`}>✓</div>
                                                    <span className="text-sm sm:text-base font-medium text-slate-700">{opt.text}</span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex justify-between items-center pt-4 border-t border-slate-100">
                                    <button onClick={handlePrev} disabled={currentIndex === 0} className={`px-5 py-2.5 rounded-xl font-semibold text-sm ${currentIndex === 0 ? 'opacity-40 cursor-not-allowed bg-slate-100 text-slate-400' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>上一题</button>
                                    <button 
                                        onClick={handleNext} 
                                        disabled={!answers[questions[currentIndex].id]} 
                                        className={`clay-btn px-8 py-3 rounded-xl font-bold text-sm text-white bg-purple-600 ${!answers[questions[currentIndex].id] ? 'opacity-50 cursor-not-allowed' : 'hover:bg-purple-700'}`}
                                    >
                                        {currentIndex === questions.length - 1 ? '生成人格报告 🎉' : '下一题'}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 4. 结果报告页 */}
                        {view === 'result' && resultType && (
                            <div className="space-y-6 animate-fade-in pb-12">
                                <div className="clay-card p-8 sm:p-10 text-center relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-48 h-48 bg-purple-100 rounded-full blur-2xl -z-10"></div>
                                    <div className="text-xs uppercase font-bold text-purple-600 tracking-widest mb-2">你的测试结果报告已生成</div>
                                    <div className="w-32 h-32 mx-auto mb-4"><LowPolyAvatar type={resultType} /></div>
                                    <h1 className="text-4xl sm:text-5xl font-black text-slate-800 mb-2">{resultType}</h1>
                                    <h2 className="text-xl sm:text-2xl font-bold text-purple-600 mb-4">{mbtiData[resultType].name} ({mbtiData[resultType].groupName})</h2>
                                    <p className="text-slate-600 max-w-xl mx-auto text-base italic">"{mbtiData[resultType].desc}"</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="clay-card p-6">
                                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-purple-600 mr-2"></span>核心特质与优缺点</h3>
                                        <div className="flex flex-wrap gap-2 mb-4">
                                            {mbtiData[resultType].traits.map((t, idx) => (
                                                <span key={idx} className="px-3 py-1.5 rounded-xl bg-purple-50 text-purple-700 text-xs font-semibold">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="clay-card p-6">
                                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center"><span className="w-2.5 h-2.5 rounded-full bg-emerald-600 mr-2"></span>适配职业建议</h3>
                                        <div className="flex flex-wrap gap-2 mb-4">
                                            {mbtiData[resultType].careers.map((c, idx) => (
                                                <span key={idx} className="px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 text-xs font-semibold">{c}</span>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 5. 16人格图鉴页 */}
                        {view === 'encyclopedia' && (
                            <div className="space-y-8 animate-fade-in pb-12">
                                <div className="text-center">
                                    <h1 className="text-3xl font-extrabold text-slate-800 mb-2">16 型人格图鉴</h1>
                                    <p className="text-slate-500 text-sm">点击任意卡片查看详细深度介绍</p>
                                </div>

                                {['Analysts', 'Diplomats', 'Sentinels', 'Explorers'].map(groupKey => {
                                    const groupItems = Object.keys(mbtiData).filter(k => mbtiData[k].group === groupKey);
                                    const groupTitle = groupItems.length > 0 ? mbtiData[groupItems[0]].groupName : '';
                                    return (
                                        <div key={groupKey} className="space-y-4">
                                            <h3 className="text-xl font-bold text-slate-800 border-l-4 border-purple-500 pl-3">{groupTitle} ({groupKey})</h3>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                                {groupItems.map(type => (
                                                    <div key={type} onClick={() => setSelectedModalType(type)} className="clay-card p-4 text-center cursor-pointer hover:scale-105 transition">
                                                        <div className="w-20 h-20 mx-auto mb-2"><LowPolyAvatar type={type} /></div>
                                                        <h4 className="font-bold text-slate-800">{type}</h4>
                                                        <p className="text-xs text-slate-500 mt-0.5">{mbtiData[type].name}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </main>

                    {/* 人格详情弹窗 */}
                    {selectedModalType && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
                            <div className="clay-card max-w-lg w-full p-6 sm:p-8 relative bg-white">
                                <button onClick={() => setSelectedModalType(null)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:bg-slate-200">✕</button>
                                <div className="flex items-center space-x-4 mb-4">
                                    <div className="w-16 h-16"><LowPolyAvatar type={selectedModalType} /></div>
                                    <div>
                                        <h3 className="text-2xl font-bold text-slate-800">{selectedModalType} - {mbtiData[selectedModalType].name}</h3>
                                        <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-purple-100 text-purple-700">{mbtiData[selectedModalType].groupName}</span>
                                    </div>
                                </div>
                                <p className="text-slate-600 text-sm mb-4 leading-relaxed">{mbtiData[selectedModalType].desc}</p>
                            </div>
                        </div>
                    )}

                    <footer className="max-w-4xl mx-auto w-full text-center py-6 text-xs text-slate-400 border-t border-slate-200/60 mt-8">
                        免责声明：本测评仅为趣味娱乐测试。管理员专用后台已启用。
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
